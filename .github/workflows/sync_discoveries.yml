name: Sync Discoveries to Profile

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-discoveries:
    name: Update Profile README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v4

      - name: Pull Bot Discoveries
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://github.com/siddharthsbhadauria/awesome-ai-discoveries/commits/main.atom"
          
          # This tells the bot to look for comment_tag_name: "LIST"
          
          max_post_count: 5
          template: "$newline - 🚀 $title ($date)"
          date_format: "yyyy-mm-dd"
          
          # Fixed the parameter name here:
          retry_count: 3
          retry_wait_time: 5

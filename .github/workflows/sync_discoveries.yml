name: Sync Discoveries to Profile

on:
  schedule:
    # Runs at 9 PM UTC daily
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual testing via the Actions tab

jobs:
  update-readme-with-discoveries:
    name: Update Profile README
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v4

      - name: Pull Bot Discoveries
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Pointer to your Bot's commit history feed
          feed_list: "https://github.com/siddharthsbhadauria/awesome-ai-discoveries/commits/main.atom"
          
          # How many recent discoveries to show
          max_post_count: 5
          
          # Format: Emoji - Commit Title (Date)
          template: "$newline - 🚀 $title ($date)"
          date_format: "yyyy-mm-dd"
          
          # Error handling
          retry_count: 3
          retry_wait_time: 5
